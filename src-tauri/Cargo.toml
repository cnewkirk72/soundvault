[package]
name = "soundvault"
version = "1.0.0"
description = "Scan Ableton projects, surface your most-used samples, and consolidate them — strictly read-only on your projects."
authors = ["Christian Newkirk <christiannewkirk@gmail.com>"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/cnewkirk72/soundvault"

[lib]
name = "soundvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2.0.3"
tauri-plugin-fs = "2.0.3"
tauri-plugin-opener = "2.0.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

flate2 = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
walkdir = "2.5"
rayon = "1.10"
blake3 = "1.5"
regex = "1.11"
once_cell = "1.20"

anyhow = "1.0"
thiserror = "2.0"

time = { version = "0.3", features = ["serde", "formatting", "macros"] }
unicode-normalization = "0.1"
dunce = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific niceties (Finder integration via opener plugin handles this).

[features]
# Default feature set. Custom protocol is enabled in tauri.conf.json.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.13"
filetime = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false

[profile.dev]
incremental = true
